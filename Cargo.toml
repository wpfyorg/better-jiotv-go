[package]
name = "jiotv"
version = "1.3.1"
edition = "2021"
default-run = "jiotv"

[[bin]]
name = "jiotv"
path = "src/main.rs"

[features]
default = ["full"]
# full: IPTV core + Svelte UI + full /api/*
full = ["dep:rust-embed", "dep:mime_guess"]
# slim: IPTV core only, no UI assets, minimal /api surface. Build with
# --no-default-features --features slim
slim = []
# extras: the optional extra channel source's login/catalogue/playback
# support (off by default even in the full build; gated at runtime by the
# `extras` config key too).
extras = []

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "query", "json"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "io-util", "macros", "process", "signal", "fs", "sync"] }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "gzip", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
aes = "0.8"
ctr = "0.9"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
subtle = "2"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
lexopt = "0.3"
thiserror = "1"
anyhow = "1"
time = { version = "0.3", features = ["formatting", "std", "local-offset"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
percent-encoding = "2"
urlencoding = "2"
tempfile = "3"
url = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
