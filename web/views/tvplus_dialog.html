{{ define "tvplus_dialog" }}
<dialog id="tvplus_modal" class="modal modal-bottom sm:modal-middle" aria-labelledby="tvplus-title">
  <div class="modal-box">
    <div class="flex flex-col items-center gap-2 mb-4 text-center">
      <h3 id="tvplus-title" class="font-bold text-xl tracking-tight">Connect JioTV+</h3>
      <p class="text-sm text-base-content/60">
        Use the mobile number registered to your JioFiber or AirFiber account.
      </p>
    </div>

    <div id="tvplus-step-number" class="flex flex-col gap-3">
      <label for="tvplus-number" class="label text-sm font-medium">Mobile number</label>
      <input
        id="tvplus-number"
        type="tel"
        class="input input-bordered w-full"
        placeholder="9876543210"
        pattern="[0-9]{10}"
        minlength="10"
        maxlength="10"
        autocomplete="tel-national"
      />
      <button type="button" onclick="tvPlusSendOTP()" class="btn btn-primary w-full">Continue</button>
    </div>

    <div id="tvplus-step-connection" class="flex flex-col gap-3 hidden">
      <p class="text-sm font-medium">Choose the connection</p>
      <div id="tvplus-connections" class="flex flex-col gap-2" role="radiogroup" aria-label="Fibre connections"></div>
      <button type="button" onclick="tvPlusChooseConnection()" class="btn btn-primary w-full">Send OTP</button>
    </div>

    <div id="tvplus-step-otp" class="flex flex-col gap-3 hidden">
      <label for="tvplus-otp" class="label text-sm font-medium">Enter the OTP</label>
      <input
        id="tvplus-otp"
        type="text"
        inputmode="numeric"
        class="input input-bordered w-full tracking-widest"
        placeholder="543210"
        maxlength="8"
        autocomplete="one-time-code"
      />
      <button type="button" onclick="tvPlusVerifyOTP()" class="btn btn-primary w-full">Connect</button>
    </div>

    <p id="tvplus-message" class="mt-3 text-sm text-center text-error" role="alert"></p>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>
{{ end }}
