name: Release

on:
  push:
    tags: ["v*"]
  # Dry runs build and verify everything but publish nothing: only a tag push
  # creates a release. A pull request that changes this workflow runs once its
  # Codex review is clean (the `codex-clean` label), so edits are tested before
  # a real tag depends on them.
  pull_request:
    types: [labeled, synchronize, reopened]
    paths: [".github/workflows/release.yml", "scripts/ci-openwrt-packages.sh", "scripts/build-openwrt-packages.sh", "openwrt/**"]
  workflow_dispatch:

permissions:
  contents: write

# A newer push to a pull request supersedes its dry run; tag releases are never cancelled.
concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'codex-clean')
    strategy:
      fail-fast: false
      matrix:
        # One job per target builds both variants, so the toolchain and the
        # dependencies are set up and compiled once. `test` runs the full test
        # suite on that target; the others only smoke-test the built binaries,
        # because CI already runs the whole suite on every change.
        target:
          - { triple: x86_64-unknown-linux-musl, os: ubuntu-latest, kind: zig }
          - { triple: aarch64-unknown-linux-musl, os: ubuntu-latest, kind: zig }
          - { triple: armv7-unknown-linux-musleabihf, os: ubuntu-latest, kind: zig }
          - { triple: i686-unknown-linux-musl, os: ubuntu-latest, kind: zig }
          - { triple: aarch64-apple-darwin, os: macos-14, kind: native, test: true }
          - { triple: x86_64-apple-darwin, os: macos-15-intel, kind: native }
          - { triple: x86_64-pc-windows-msvc, os: windows-2022, kind: native, test: true }
          - { triple: i686-pc-windows-msvc, os: windows-2022, kind: native }
          - { triple: aarch64-pc-windows-msvc, os: windows-11-arm, kind: native }
          - { triple: aarch64-linux-android, os: ubuntu-latest, kind: android }
          - { triple: armv7-linux-androideabi, os: ubuntu-latest, kind: android }
          - { triple: x86_64-linux-android, os: ubuntu-latest, kind: android }
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target.triple }}
      - name: Install Zig
        if: matrix.target.kind == 'zig'
        run: pip3 install ziglang
      # Prebuilt binaries: compiling these with `cargo install` took minutes per job.
      - uses: taiki-e/install-action@v2
        if: matrix.target.kind != 'native'
        with:
          tool: ${{ matrix.target.kind == 'zig' && 'cargo-zigbuild' || 'cargo-ndk' }}
      - uses: android-actions/setup-android@v4
        if: matrix.target.kind == 'android'
      - name: Install Android NDK
        if: matrix.target.kind == 'android'
        run: sdkmanager "ndk;27.2.12479018"
      - name: Build
        shell: bash
        run: |
          mkdir out
          suffix=""
          case "${{ matrix.target.triple }}" in *windows-msvc) suffix=.exe ;; esac
          for variant in full slim; do
            flags=()
            if [ "$variant" = slim ]; then flags=(--no-default-features --features slim); fi
            case "${{ matrix.target.kind }}" in
              zig) cargo zigbuild --release --locked --target "${{ matrix.target.triple }}" "${flags[@]}" ;;
              android) cargo ndk --target "${{ matrix.target.triple }}" --platform 21 build --release --locked "${flags[@]}" ;;
              *) cargo build --release --locked --target "${{ matrix.target.triple }}" "${flags[@]}" ;;
            esac
            cp "target/${{ matrix.target.triple }}/release/jiotv${suffix}" "out/jiotv-${variant}-${{ matrix.target.triple }}${suffix}"
          done
      - name: Run native target tests
        if: matrix.target.test
        shell: bash
        run: cargo test --locked --target "${{ matrix.target.triple }}"
      - name: Smoke-test the built binaries
        if: matrix.target.kind == 'native' || matrix.target.triple == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          for binary in out/*; do
            "$binary" --help >/dev/null
          done
      - name: Parse the Windows installer
        if: matrix.target.triple == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: jiotv-${{ matrix.target.triple }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  openwrt:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, target: x86/64, format: opkg, sdk_version: '24.10.8' }
          - { arch: x86_64, target: x86/64, format: apk, sdk_version: '25.12.5' }
          - { arch: aarch64, target: mediatek/filogic, format: opkg, sdk_version: '24.10.8' }
          - { arch: aarch64, target: mediatek/filogic, format: apk, sdk_version: '25.12.5' }
          - { arch: armv7, target: bcm27xx/bcm2709, format: opkg, sdk_version: '24.10.8' }
          - { arch: armv7, target: bcm27xx/bcm2709, format: apk, sdk_version: '25.12.5' }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jiotv-${{ matrix.arch == 'x86_64' && 'x86_64-unknown-linux-musl' || matrix.arch == 'aarch64' && 'aarch64-unknown-linux-musl' || 'armv7-unknown-linux-musleabihf' }}
          path: dist/bin
      - name: Restore executable permissions
        run: chmod 0755 dist/bin/jiotv-*
      - name: Install SDK archive support
        run: sudo apt-get update && sudo apt-get install -y zstd
      # A tag names the version; a dry run has no tag, and its ref name (for example
      # "15/merge") is not usable as a package version, so it comes from Cargo.toml.
      - name: Package version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}
          else version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build packages with the OpenWrt SDK
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
          PACKAGE_FORMAT: ${{ matrix.format }}
          PACKAGE_TARGET: ${{ matrix.target }}
          SDK_VERSION: ${{ matrix.sdk_version }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: scripts/ci-openwrt-packages.sh "$PACKAGE_FORMAT" "$PACKAGE_TARGET" "$SDK_VERSION" "$PACKAGE_ARCH" "$APP_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.format }}-${{ matrix.arch }}
          path: dist/openwrt/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build, openwrt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          [ "$want" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $want"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify expected release assets and generate checksums
        run: |
          set -eu
          for variant in full slim; do
            for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf i686-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
              test -s "dist/jiotv-${variant}-${target}"
            done
            for target in x86_64-pc-windows-msvc i686-pc-windows-msvc aarch64-pc-windows-msvc; do
              test -s "dist/jiotv-${variant}-${target}.exe"
            done
          done
          test "$(find dist -type f -name '*.ipk' | wc -l)" -ge 6
          test "$(find dist -type f -name '*.apk' | wc -l)" -ge 6
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum
          ) > SHA256SUMS.tmp
          mv SHA256SUMS.tmp dist/SHA256SUMS
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
