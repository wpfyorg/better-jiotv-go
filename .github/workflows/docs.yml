name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'scripts/check-doc-links.py'
  pull_request:
    types: [labeled, synchronize, reopened]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'scripts/check-doc-links.py'

permissions:
  contents: read

jobs:
  build:
    # Pull requests run only after Codex review is clean: the `codex-clean` label
    # is added once the review has no open findings. Pushes to main always run.
    if: >-
      github.event_name == 'push' ||
      (contains(github.event.pull_request.labels.*.name, 'codex-clean') &&
       (github.event.action != 'labeled' || github.event.label.name == 'codex-clean'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@mdbook
      - uses: actions/configure-pages@v5
      - run: python3 scripts/check-doc-links.py
      - run: mdbook build docs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/book

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
