name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    # Pull requests run only after Codex review is clean: the `codex-clean` label
    # is added once the review has no open findings. Pushes to main always run.
    if: >-
      github.event_name == 'push' ||
      (contains(github.event.pull_request.labels.*.name, 'codex-clean') &&
       (github.event.action != 'labeled' || github.event.label.name == 'codex-clean'))
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "--no-default-features --features slim"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test ${{ matrix.features }}
      - run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings
      - run: sh scripts/tests/install-test.sh
